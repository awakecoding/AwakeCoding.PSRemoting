syntax = "proto3";

option csharp_namespace = "AwakeCoding.PSRemoting.PowerShell.Grpc";

package awakecoding.psremoting;

service PSHostGrpcTransport {
  rpc Connect(stream PSHostGrpcFrame) returns (stream PSHostGrpcFrame);
}

message PSHostGrpcFrame {
  PSHostGrpcFrameKind kind = 1;
  bytes payload = 2;
  string ps_guid = 3;
  string stream = 4;
  uint64 object_id = 5;
  uint64 fragment_id = 6;
  uint32 blob_flags = 7;
  uint32 destination = 8;
  uint32 data_type = 9;
  bytes runspace_pool_id = 10;
  bytes powershell_id = 11;
  PSHostGrpcPayloadEncoding payload_encoding = 12;
}

enum PSHostGrpcPayloadEncoding {
  Protobuf = 0;
  Cbor = 1;
}

enum PSHostGrpcFrameKind {
  Input = 0;
  Output = 1;
  Error = 2;
  Close = 3;
  Data = 4;
  DataAck = 5;
  Command = 6;
  CommandAck = 7;
  ClosePacket = 8;
  CloseAck = 9;
  Signal = 10;
  SignalAck = 11;
}

